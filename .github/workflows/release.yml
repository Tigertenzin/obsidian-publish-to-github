name: Release

# Tagging is the release. The tag must equal the version in manifest.json,
# which is what BRAT and Obsidian compare against; `npm version` keeps the two
# in step, and the check below refuses the release if they ever drift.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          manifest_version="$(jq -r .version manifest.json)"
          if [ "$GITHUB_REF_NAME" != "$manifest_version" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match manifest.json version '$manifest_version'."
            echo "Obsidian and BRAT require them to be identical, with no leading 'v'."
            echo "Use 'npm version <patch|minor|major>' to bump both together."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Type-checks as well as bundles, and runs the tests, so a broken release
      # cannot be published.
      - run: npm run build

      - run: npm test

      # Hand-written notes in release-notes/<version>.md when there are any,
      # otherwise GitHub's list of the changes since the last release.
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes_file="release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes_file" ]; then
            notes=(--notes-file "$notes_file")
          else
            notes=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" \
            main.js manifest.json styles.css \
            --title "$GITHUB_REF_NAME" \
            "${notes[@]}"

      # The website reads the latest release when it builds, so ask its host to
      # rebuild now. Set the host's build hook URL as the SITE_BUILD_HOOK
      # repository secret; without it this step does nothing.
      - name: Rebuild the website
        env:
          SITE_BUILD_HOOK: ${{ secrets.SITE_BUILD_HOOK }}
        run: |
          if [ -z "$SITE_BUILD_HOOK" ]; then
            echo "No SITE_BUILD_HOOK secret set; skipping the website rebuild."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$SITE_BUILD_HOOK"

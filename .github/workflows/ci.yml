name: CI

# Every push and pull request is type-checked, tested and built, so a broken
# change shows up on the branch rather than at release time.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      # Type-checks the plugin and the tests, then bundles.
      - run: npm run build

      - run: npm test
